<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WoW Forever – Charakter-Roulette</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#eee6d5;background:#0a101a;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 45% 0,#203347,#0a101a 70%)}main{max-width:1240px;margin:auto;padding:25px 18px}h1,h2,h3{font-family:Georgia,serif}h1{color:#f2ce86;margin:5px 0 20px;font-size:clamp(28px,4vw,43px)}.overline{color:#aebbc9;font-size:12px;letter-spacing:2px}.layout{display:grid;grid-template-columns:1fr;gap:20px}.panel{background:#131e2b;border:1px solid #344658;border-radius:15px;overflow:hidden;box-shadow:0 12px 32px #0006}.stage{height:440px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#2b3b4d,#101722);padding:22px}.stage img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 17px #000a)}.details{padding:20px 24px}.details h2{color:#f2ce86;font-size:29px;margin:7px 0}.details p{color:#b9c4d0;margin:8px 0}.filters{padding:22px}.filters h2{margin:0 0 5px;color:#f2ce86}.hint{font-size:13px;color:#a8b9c8;line-height:1.5}.group{margin-top:20px}.group>h3{margin:0 0 10px;color:#d7c39a;font-size:18px}.factions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.faction{border:1px solid #3d4d5d;border-radius:11px;padding:12px;background:#182635}.faction.alliance{border-top:3px solid #387bb5}.faction.horde{border-top:3px solid #b65040}.factionhead{display:flex;align-items:center;gap:9px;padding-bottom:10px;border-bottom:1px solid #354758;font-weight:700;color:#f1d493}.choices{display:grid;gap:7px;margin-top:10px}.choice{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid transparent;border-radius:7px;cursor:pointer;font-size:14px;min-width:0}.choice:hover{background:#26384a;border-color:#44566a}.choice:has(input:checked){background:#21364a}.choice input,.factionhead input{accent-color:#e0b765;width:17px;height:17px;flex:none}.choice img,.factionhead img{width:27px;height:27px;object-fit:cover;border-radius:5px;border:1px solid #516174}.glyph{display:inline-flex;width:27px;height:27px;align-items:center;justify-content:center;background:linear-gradient(140deg,#4a3a27,#1e3044);border:1px solid #516174;border-radius:5px;font-family:Georgia,serif;font-size:16px;color:#e9c787;flex:none}.classgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.bodygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.bodygrid .choice{border:1px solid #354758;padding:10px}.toolbar{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.toolbar button{background:#263b4d;color:#e8d8b4;border:1px solid #51657a;border-radius:7px;padding:8px 13px;cursor:pointer}.toolbar button:hover{background:#34516a}.summary{margin-top:18px;border-top:1px solid #344658;padding-top:14px;font-size:14px;color:#c9d2dc}.summary strong{color:#f0d08b}.warning{color:#eebd81;margin-top:6px;min-height:20px}.assetnote{margin-top:12px;font-size:12px;color:#96a9bb}footer{color:#8c9caf;font-size:12px;margin-top:17px}@media(max-width:850px){.layout{grid-template-columns:1fr}.stage{height:350px}}@media(max-width:440px){.factions{grid-template-columns:1fr}.classgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.generate-wrap{position:sticky;top:0;z-index:20;padding:12px 0;background:#0a101af0;backdrop-filter:blur(10px)}.generate{width:100%;border:1px solid #f0c777;border-radius:11px;background:linear-gradient(#d6a64d,#8d5a25);color:#16120e;font-size:20px;font-weight:800;padding:15px;cursor:pointer}.generate:disabled{opacity:.4;cursor:not-allowed}.result-panel{max-width:900px;margin:0 auto}.stage img{max-height:100%}#image-notice{min-height:1em}@media(max-width:850px){.generate-wrap{top:0}} 
/* Kompakte Filter: die Figur bleibt der visuelle Mittelpunkt. */
main{max-width:1060px;padding:16px 16px 26px}h1{margin:2px 0 12px;font-size:clamp(25px,3vw,36px)}
.layout{gap:10px}.filters{padding:13px 16px}.filters h2{font-size:21px;margin:0 0 2px}.filters>.hint{font-size:12px;line-height:1.35}
.group{margin-top:10px}.group>h3{font-size:15px;margin:0 0 6px}.factions{gap:10px}.faction{padding:8px 10px;border-radius:8px}.factionhead{padding-bottom:5px;font-size:14px}
.choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 5px;margin-top:5px}.choice{padding:3px 5px;gap:6px;font-size:13px;line-height:1.2}
.choice input,.factionhead input{width:15px;height:15px}.choice img,.factionhead img,.glyph{width:22px;height:22px;font-size:13px}
.secondary-filters{display:grid;grid-template-columns:3fr 2fr;gap:14px;align-items:start}.classgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}.bodygrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.bodygrid .choice{padding:5px}
.toolbar{margin-top:8px;justify-content:flex-start}.toolbar button{font-size:12px;padding:5px 9px}.summary{margin-top:8px;padding-top:8px;font-size:12px}.warning{min-height:0;margin-top:2px}
.generate-wrap{padding:7px 0}.generate{font-size:17px;padding:10px}.stage{height:440px}
@media(max-width:700px){.filters{padding:11px}.factions{grid-template-columns:1fr 1fr;gap:7px}.faction{padding:7px}.choices{grid-template-columns:1fr}.secondary-filters{grid-template-columns:1fr;gap:0}.classgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.bodygrid{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{height:350px}}
@media(max-width:390px){.factions{grid-template-columns:1fr}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.classgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Die Konfiguration ist beim ersten Besuch sichtbar und danach einklappbar. */
.filter-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.filter-header h2{margin:0}
.filter-toggle{background:#263b4d;color:#f2ce86;border:1px solid #51657a;border-radius:8px;padding:7px 11px;font-weight:650;cursor:pointer;white-space:nowrap}
.filter-toggle:hover{background:#34516a}
#filter-content[hidden]{display:none}
.filters.is-collapsed{padding:10px 16px}
.filters.is-collapsed .filter-header h2{font-size:17px}
@media(max-width:440px){.filter-toggle{font-size:13px;padding:7px 9px}}

/* Ergebnis und Bedienung bilden eine gemeinsame, volle Spaltenbreite. */
.result-panel{max-width:none;width:100%;margin:0}
.generate-wrap{width:100%}
.details h2{color:var(--class-color,#f2ce86);text-shadow:0 2px 4px #000,0 0 11px #000,1px 1px 1px #000,-1px -1px 1px #000}
.stage{position:relative;isolation:isolate;background-color:#111e2a;background-position:center;background-size:cover;background-repeat:no-repeat}
.result-panel[data-faction="alliance"] .stage{background-image:linear-gradient(0deg,rgba(4,12,24,.30),rgba(4,12,24,.30)),url('images/alliance-background.webp')}
.result-panel[data-faction="horde"] .stage{background-image:linear-gradient(0deg,rgba(18,3,5,.32),rgba(18,3,5,.32)),url('images/horde-background.webp')}
.stage img{position:relative;z-index:1;filter:drop-shadow(0 10px 15px #000d)}

/* Lokale Icons, Spezialisierungen und fraktionsabhängiges Gesamtthema */
.specgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.spec-group{border:1px solid #45505d;border-radius:8px;padding:7px}.spec-group h4{margin:0 0 4px;font-size:13px;color:#d7c39a}.spec-group .choice{font-size:12px}.spec-group .choice img{object-fit:cover}
#character-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px}#character-meta img,#character-meta .glyph{width:24px;height:24px;object-fit:contain;vertical-align:middle;border:0;background:none}
.factionhead img{object-fit:contain;border:0;border-radius:0;background:none;width:26px;height:26px}
.stage-badges{position:absolute;top:17px;left:18px;z-index:3;display:flex;align-items:flex-end}.stage-badges>img:first-child{width:76px;height:76px;border:3px solid #c8a35c;border-radius:12px;box-shadow:0 3px 10px #000b}.stage-badges>img:nth-child(2){width:43px;height:43px;margin-left:-16px;margin-bottom:-8px;border:2px solid #c8a35c;border-radius:8px;box-shadow:0 3px 10px #000b}.stage-badges .glyph{width:65px;height:65px}
:root:has(#result[data-faction="horde"]){background:#16090e}
body{min-height:100vh}
body:has(#result[data-faction="horde"]){background:radial-gradient(ellipse at 45% 0,#47202c,#16090e 70%)}
body:has(#result[data-faction="horde"]) .panel{background:#24131b;border-color:#693743}
body:has(#result[data-faction="horde"]) .faction{background:#321c25;border-color:#6c4049}
body:has(#result[data-faction="horde"]) .choice:hover,body:has(#result[data-faction="horde"]) .choice:has(input:checked){background:#48232c}
body:has(#result[data-faction="horde"]) .generate-wrap{background:#16090eea}
body:has(#result[data-faction="horde"]) .generate{background:linear-gradient(#bd6d62,#79313c);border-color:#c78670;color:#fff3e6}
body:has(#result[data-faction="horde"]) .filter-toggle,body:has(#result[data-faction="horde"]) .toolbar button{background:#482530;border-color:#8a535b}
@media(max-width:700px){.specgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.specgrid{grid-template-columns:1fr}}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px}.page-top h1{margin:0}.language-control{display:flex;align-items:center;gap:8px;font-size:12px;color:#d7c39a;white-space:nowrap}.language-control select{background:#1b2d3f;color:#f2ce86;border:1px solid #51657a;border-radius:7px;padding:7px;cursor:pointer}body:has(#result[data-faction="horde"]) .language-control select{background:#482530;border-color:#8a535b}@media(max-width:540px){.page-top{align-items:flex-start;flex-direction:column}.language-control{align-self:flex-end}}
.group.filter-empty{outline:2px solid #d9535b;outline-offset:3px;border-radius:5px}
.filters.is-collapsed.has-empty-filter .filter-header{outline:2px solid #d9535b;outline-offset:3px;border-radius:5px}
.release-version{max-width:1240px;margin:0 auto;padding:0 18px 14px;text-align:right;color:#8c9caf;font-size:11px}</style></head><body><main><div class="overline">WORLD OF WARCRAFT · FOREVER</div><div class="page-top"><h1 id="page-title">Charakter-Roulette</h1><label class="language-control"><span>Language / Sprache</span><select id="language-select" aria-label="Language / Sprache"><option value="auto">Auto / Automatisch</option><option value="de">Deutsch</option><option value="en">English</option></select></label></div><div class="layout"><section class="panel filters" id="filter-panel"><div class="filter-header"><h2 id="filters-heading">Auswahl</h2><button type="button" id="toggle-filters" class="filter-toggle" aria-controls="filter-content" aria-expanded="true">Filter ausblenden <span aria-hidden="true">▴</span></button></div><div id="filter-content"><div class="hint" id="filters-hint">Wähle die möglichen Fraktionen, Völker, Klassen und Geschlechter. Die Auswahl bleibt beim Neuladen gespeichert.</div><div class="group"><h3 id="factions-heading">Fraktionen &amp; Völker</h3><div class="factions" id="factions"></div></div><div class="secondary-filters"><div class="group"><h3 id="classes-heading">Klassen</h3><div class="classgrid" id="classes"></div></div><div class="group"><h3 id="gender-heading">Geschlecht</h3><div class="bodygrid" id="bodytypes"></div></div></div><div class="group"><h3 id="specs-heading">Spezialisierungen</h3><div class="specgrid" id="specs"></div></div><div class="toolbar"><button id="all" type="button">Alle auswählen</button><button id="none" type="button">Alle abwählen</button></div><div class="summary" aria-live="polite"><strong id="count"></strong><div class="warning" id="warning"></div></div></div></section><div class="generate-wrap"><button class="generate" id="generate" type="button">⚄ Charakter generieren</button></div><section class="panel result-panel" id="result" data-faction="alliance"><div class="stage"><div id="stage-badges" class="stage-badges"></div><img id="character-image" src="images/characters/warrior-dwarf-male.webp" alt="Generierter Charakter"></div><div class="details"><div class="overline" id="your-character">DEIN CHARAKTER</div><h2 id="character-name">…</h2><p id="character-meta"></p><p class="hint" id="image-notice"></p></div></section></div></main><div class="release-version" aria-label="Version">v1.1.2</div><script src="app.js?v=1.1.2"></script></body></html>
